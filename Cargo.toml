[workspace]
resolver = "2"
members = [
    "crates/hook-types",
    "crates/hook-runtime",
    "crates/policy-vm",
    "crates/pump-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pump-hooks/pump-hooks"

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
hook-types = { path = "crates/hook-types" }
hook-runtime = { path = "crates/hook-runtime" }
policy-vm = { path = "crates/policy-vm" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

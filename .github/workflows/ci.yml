name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: v4.0.1
  CARGO_TERM_COLOR: always

jobs:
  programs:
    name: programs (build-sbf + LiteSVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache Agave toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: agave-${{ env.AGAVE_VERSION }}-${{ runner.os }}

      - name: Install Agave
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          rustc --version
          solana --version
          cargo build-sbf --version

      - name: Build programs
        run: scripts/build_programs.sh

      - name: Fetch Pump program binaries (devnet, read-only)
        run: scripts/dump_programs.sh https://api.devnet.solana.com

      - name: Test
        run: cargo test --workspace

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: TypeScript tests that load the built programs
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pump-hooks/execution-lab test
        env:
          PUMPHOOKS_SBF: "1"

  packages:
    name: packages (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r test

[package]
name = "hook-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measured compute units for hook stacks: per-builtin cost of token-hooks Execute (Mollusk) and Token-2022 transfers with and without the hook (LiteSVM). Writes bench/results.json and docs/benchmarks/report.md; the regression test compares with bench/baseline.json."
license = "Apache-2.0"

[[bin]]
name = "hook-bench"
path = "src/main.rs"

[dependencies]
mollusk-svm = "=0.15.1"
litesvm = "=0.16.0"
solana-account = "4.3"
solana-pubkey = "4.1"
solana-address = "2.6"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022"] }
bytemuck = { workspace = true }
hook-standard = { workspace = true }
hook-kernel = { workspace = true }
token-hooks = { path = "../programs/token-hooks", features = ["no-entrypoint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

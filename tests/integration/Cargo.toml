[package]
name = "pump-hooks-integration"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM tests: the pump-hooks program routing through the real Pump AMM binary against cloned devnet state."

[dependencies]

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
anchor-lang = "0.31.1"
pump-hooks = { path = "../../programs/pump-hooks", features = ["no-entrypoint"] }
pump-adapter = { path = "../../crates/pump-adapter" }
hook-types = { workspace = true }
hook-runtime = { workspace = true }
policy-vm = { workspace = true }
bytemuck = { workspace = true }
serde_json = "1"
base64 = "0.22"

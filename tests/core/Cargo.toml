[package]
name = "hooks-core-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM tests for the programmable-market core with a scriptable (and hostile) test hook."

[dependencies]

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["serde"] }
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
hooks-core = { path = "../../programs/hooks-core", features = ["no-entrypoint"] }
hooks-interface = { workspace = true }
test-hook = { path = "../../programs/test-hook", features = ["no-entrypoint"] }
hook-registry = { path = "../../programs/hook-registry", features = ["no-entrypoint"] }
hook-standard = { workspace = true }
hook-kernel = { workspace = true }
bincode = "1.3"
bytemuck = { workspace = true }

[package]
name = "pump-hooks-engine-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM tests for the hook registry, smart accounts, token wrapper and token hooks."

[dependencies]

[dev-dependencies]
litesvm = { version = "=0.16.0", features = ["precompiles"] }
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
bytemuck = { workspace = true }
hook-standard = { workspace = true }
hook-kernel = { workspace = true }
hook-registry = { path = "../../programs/hook-registry", features = ["no-entrypoint"] }
smart-accounts = { path = "../../programs/smart-accounts", features = ["no-entrypoint"] }
hook-router = { path = "../../programs/hook-router", features = ["no-entrypoint"] }
token-hooks = { path = "../../programs/token-hooks", features = ["no-entrypoint"] }
token-wrapper = { path = "../../programs/token-wrapper", features = ["no-entrypoint"] }
pump-adapter = { path = "../../crates/pump-adapter" }
serde_json = "1"
base64 = "0.22"

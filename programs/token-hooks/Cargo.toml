[package]
name = "token-hooks"
version = "0.1.0"
edition = "2021"
description = "PUMP HOOKS TOKEN engine: a Token-2022 transfer hook that runs a token-environment hook stack on every transfer of a mint that names it. Native enforcement for that mint only."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_hooks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022"] }
spl-tlv-account-resolution = "0.9"
spl-transfer-hook-interface = "0.9"
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
hook-standard = { workspace = true }
hook-kernel = { workspace = true }
hook-registry = { path = "../hook-registry", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }

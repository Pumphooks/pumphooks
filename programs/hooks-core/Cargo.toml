[package]
name = "hooks-core"
version = "0.1.0"
edition = "2021"
description = "Programmable-market core: pools, vaults, LP shares, settlement, hook registry and hook invocation."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "hooks_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
hooks-interface = { workspace = true }
hook-standard = { workspace = true }
hook-kernel = { workspace = true }
hook-registry = { path = "../hook-registry", features = ["cpi"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "allow" }

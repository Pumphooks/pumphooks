[package]
name = "pump-hooks"
version = "0.1.0"
edition = "2021"
description = "Pump Hooks: hook registry, router and policy engine for existing Pump markets"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "pump_hooks"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
bytemuck = { workspace = true }
hook-types = { workspace = true }
hook-runtime = { workspace = true }
policy-vm = { workspace = true }
pump-adapter = { path = "../../crates/pump-adapter" }

[lints.rust]
unexpected_cfgs = { level = "allow" }
